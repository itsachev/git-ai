<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>git-ai</title>
    <!-- Set the theme before first paint so dark mode doesn't flash light. Mirrors src/lib/theme.tsx. -->
    <script>
      try { var t = localStorage.getItem("theme"); } catch (e) {}
      document.documentElement.dataset.theme = t === "light" ? t : t === "system" && !matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark";
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
